global:
  scrape_interval: 15s

scrape_configs:
  - job_name: events-api
    static_configs:
      - targets: ['host.docker.internal:5087']
    metrics_path: /metrics

  - job_name: bookings-api
    static_configs:
      - targets: ['host.docker.internal:5086']
    metrics_path: /metrics

  - job_name: users-api
    static_configs:
      - targets: ['host.docker.internal:5088']
    metrics_path: /metrics 